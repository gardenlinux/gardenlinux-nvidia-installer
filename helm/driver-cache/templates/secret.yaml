{{/*
Generate self-signed CA, server cert, and client cert once and pin them across upgrades.
On helm template (no Kubernetes API) lookup returns nil and certs are (re)generated each time —
that is expected behaviour for dry-runs.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "driver-cache-tls" -}}
{{- if $existing -}}
apiVersion: v1
kind: Secret
metadata:
  name: driver-cache-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "driver-cache.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ca.crt:     {{ index $existing.data "ca.crt" }}
  server.crt: {{ index $existing.data "server.crt" }}
  server.key: {{ index $existing.data "server.key" }}
  client.crt: {{ index $existing.data "client.crt" }}
  client.key: {{ index $existing.data "client.key" }}
{{- else -}}
{{- $ca := genCA "driver-cache-ca" 3650 -}}
{{- $serverDNS := list
      "driver-cache"
      (printf "driver-cache.%s" .Release.Namespace)
      (printf "driver-cache.%s.svc" .Release.Namespace)
      (printf "driver-cache.%s.svc.cluster.local" .Release.Namespace) -}}
{{- $serverCert := genSignedCert "driver-cache" nil $serverDNS 3650 $ca -}}
{{- $clientCert := genSignedCert "driver-cache-client" nil nil 3650 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: driver-cache-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "driver-cache.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  ca.crt:     {{ $ca.Cert | b64enc }}
  server.crt: {{ $serverCert.Cert | b64enc }}
  server.key: {{ $serverCert.Key | b64enc }}
  client.crt: {{ $clientCert.Cert | b64enc }}
  client.key: {{ $clientCert.Key | b64enc }}
{{- end }}
