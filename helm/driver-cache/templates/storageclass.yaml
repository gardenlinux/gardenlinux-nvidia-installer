{{- if .Values.storage.volumeType }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "driver-cache.name" . }}
  labels:
    {{- include "driver-cache.labels" . | nindent 4 }}
provisioner: cinder.csi.openstack.org
parameters:
  type: {{ .Values.storage.volumeType }}
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
{{- end }}
