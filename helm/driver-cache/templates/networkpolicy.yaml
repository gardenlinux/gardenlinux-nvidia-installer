apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: driver-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "driver-cache.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "driver-cache.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gpuOperatorNamespace }}
      ports:
        - protocol: TCP
          port: 5000
