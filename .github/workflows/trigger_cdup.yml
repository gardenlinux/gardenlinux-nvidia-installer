name: Trigger cdup(Component Descriptor upload used for Vulnerability Scan) on release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  trigger-cdup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cdup workflow
        run: |
          gh workflow run cdup.yml \
            --ref ${{ github.event.release.tag_name }} \
            --field version_input=${{ github.event.release.tag_name }} \
            --field commit_input=${{ github.event.release.target_commitish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
