cdi:
  enabled: true
  default: true
toolkit:
  installDir: /opt/nvidia
driver:
  imagePullPolicy: Always
  usePrecompiled: false
  version: 615
  repository: ghcr.io/gardenlinux/gardenlinux-nvidia-installer/1.25.0
  env:
    # Build nvidia-fs (GPUDirect Storage) at runtime. The version is read from
    # versions.yaml baked into the image; set NVIDIA_FS_VERSION here to override.
    - name: ENABLE_GDS
      value: "true"
node-feature-discovery:
  worker:
    config:
      sources:
        custom:
          - name: "gardenlinux-version"
            labelsTemplate: |
              {{ range .system.osrelease }}feature.node.kubernetes.io/system-os_release.VERSION_ID=0
              {{ end }}
            matchFeatures:
              - feature: system.osrelease
                matchExpressions:
                  GARDENLINUX_VERSION: {op: Exists}
