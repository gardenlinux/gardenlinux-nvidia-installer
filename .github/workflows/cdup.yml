name: cdup
on:
  workflow_dispatch:
    inputs:
      version_input:
        description: 'Version/Tag to checkout'
        required: true
        type: string
      commit_input:
        description: 'Commit of the Tag'
        required: true
        type: string
  workflow_run:
    workflows: ["Create GitHub release"]
    types: [completed]

jobs:
  cdup:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.event.inputs.version_input }}

      - name: Resolve version and commit
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "version=$(cat release-version.yaml)" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version_input }}" >> "$GITHUB_OUTPUT"
            echo "commit=${{ github.event.inputs.commit_input }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.version }}

      - name: Download dependencies
        run: |
          cd cdup
          go mod tidy
      - name: Authenticate to Vault via GitHub OIDC
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b # v3.4.0
        with:
          method: jwt
          url: ${{ vars.VAULT_ADDR }}
          namespace: ${{ vars.VAULT_NAMESPACE }}
          path: ${{ vars.VAULT_PATH }}
          role: ${{ vars.VAULT_ROLE }}
          exportToken: true
      - name: Build cdup
        run: |
          cd cdup
          go build -o cdup
      - name: Run cdup
        run: |
          ./cdup/cdup -v ${{ steps.resolve.outputs.version }} -c ${{ steps.resolve.outputs.commit }}
