name: Complete Helm CI/CD
on:
  schedule:
    - cron: '0 18 * * 1-5'
env:
  CHART_PATH: ./tests

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Helm lint
        run: |
          helm lint ${{ env.CHART_PATH }}

  test:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      # This is required for requesting the JWT
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to cluster
        id: kube_auth
        uses: gardener/cc-utils/.github/actions/kubernetes-auth@b7e4d874f30171964c5262a0bc20d644f4bcedba
        with:
          server:  ${{ secrets.CLUSTER_SERVER }}
          server-ca-discovery-url: ${{ secrets.CLUSTER_CA_DISCOVERY_URL }}
          audience: gpu-ci-test
          service-account-name: ci-gpu-test-sa
          service-account-namespace: gpu-operator
          service-account-token-expiration: 600
          
#      - name: Wake up cluster
#        env:
#          KUBECONFIG: kubeconfig.yaml
#        run: |
#          kubectl patch shoot gpu-ci-test -n garden-gl-ai -p '{"spec":{"hibernation":{"enabled":false}}}'
      
      - name: Wait for cluster
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes

      - name: Install nvidia installer
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo update
          helm upgrade --install -n gpu-operator gpu-operator nvidia/gpu-operator --values helm/gpu-operator-values.yaml

      - name: Wait until all the pods are up and running
        run: |
          sleep 3m

      - name: Install chart
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          helm install test-release ${{ env.CHART_PATH }} \
            -n gpu-operator \
            --wait \
            --timeout 10m \
            --values ${{ env.CHART_PATH }}/values.yaml

      - name: Run Helm tests
        env:
          KUBECONFIG: kubeconfig.yaml
        id: helm-test
        continue-on-error: true
        run: |
          source .ci/helm_test.sh
          helm test test-release -n gpu-operator --logs 2>&1 | tee test-output.log
          evaluate_helm_test_output test-output.log "${PIPESTATUS[0]}"
          check_pod_statuses gpu-operator "app.kubernetes.io/instance=test-release,test=true"

      - name: Debug on failure
        env:
          KUBECONFIG: kubeconfig.yaml
        if: steps.helm-test.outcome == 'failure'
        run: |
          echo "=== Helm Test Failed ==="
          kubectl get pods -n gpu-operator
          kubectl describe pods -l "app.kubernetes.io/instance=test-release"
          helm status test-release -n gpu-operator

      - name: Cleanup
        env:
          KUBECONFIG: kubeconfig.yaml
        if: always()
        run: |
          helm uninstall test-release -n gpu-operator || true
          helm uninstall gpu-operator -n gpu-operator || true

#     - name: Hibernate  cluster
#        env:
#          KUBECONFIG: kubeconfig.yaml
#        if: always()
#        run: |
#          kubectl patch shoot gpu-ci-test -n garden-gl-ai -p '{"spec":{"hibernation":{"enabled":true}}}'

      - name: Fail workflow if tests failed
        if: steps.helm-test.outcome == 'failure'
        run: exit 1

  cache-hit-miss-test:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to cluster
        id: kube_auth
        uses: gardener/cc-utils/.github/actions/kubernetes-auth@b7e4d874f30171964c5262a0bc20d644f4bcedba
        with:
          server: ${{ secrets.CLUSTER_SERVER }}
          server-ca-discovery-url: ${{ secrets.CLUSTER_CA_DISCOVERY_URL }}
          audience: gpu-ci-test
          service-account-name: ci-gpu-test-sa
          service-account-namespace: gpu-operator
          service-account-token-expiration: 600

      - name: Wait for cluster
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes

      - name: Install driver-cache chart
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          helm upgrade --install driver-cache ./helm/driver-cache \
            -n nvidia-driver-cache \
            --create-namespace \
            --wait \
            --timeout 5m

      - name: Copy TLS secret to gpu-operator namespace
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          # The driver pods run in gpu-operator; valueFrom.secretKeyRef resolves there.
          kubectl get secret driver-cache-tls -n nvidia-driver-cache -o json \
            | jq 'del(.metadata.creationTimestamp,.metadata.resourceVersion,.metadata.uid,.metadata.managedFields)
                  | .metadata.namespace = "gpu-operator"' \
            | kubectl apply -f -

      - name: Install gpu-operator with runtime cache values
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo update
          helm upgrade --install -n gpu-operator gpu-operator nvidia/gpu-operator \
            --values helm/gpu-operator-values-runtime.yaml

      - name: Wait for first driver pod — cold miss (compiles driver)
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          kubectl wait pod \
            -n gpu-operator \
            -l app=nvidia-driver-daemonset \
            --for=condition=Ready \
            --timeout=35m

      - name: Assert first pod logs [CACHE] miss and nvidia-smi exits 0
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          POD=$(kubectl get pods -n gpu-operator -l app=nvidia-driver-daemonset \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Checking pod: ${POD}"
          kubectl logs -n gpu-operator "${POD}" -c nvidia-driver-ctr \
            | grep -F "[CACHE] miss"
          kubectl exec -n gpu-operator "${POD}" -c nvidia-driver-ctr -- nvidia-smi

      - name: Delete driver pod to trigger cache-hit run
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          OLD_POD=$(kubectl get pods -n gpu-operator -l app=nvidia-driver-daemonset \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pod -n gpu-operator "${OLD_POD}"
          # Wait for the specific old pod to be gone before selecting the replacement.
          kubectl wait pod -n gpu-operator "${OLD_POD}" --for=delete --timeout=2m
          kubectl wait pod \
            -n gpu-operator \
            -l app=nvidia-driver-daemonset \
            --for=condition=Ready \
            --timeout=10m

      - name: Assert second pod logs [CACHE] hit and nvidia-smi exits 0
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          POD=$(kubectl get pods -n gpu-operator -l app=nvidia-driver-daemonset \
            -o jsonpath='{.items[0].metadata.name}')
          echo "Checking pod: ${POD}"
          kubectl logs -n gpu-operator "${POD}" -c nvidia-driver-ctr \
            | grep -F "[CACHE] hit"
          kubectl exec -n gpu-operator "${POD}" -c nvidia-driver-ctr -- nvidia-smi

      - name: Debug on failure
        env:
          KUBECONFIG: kubeconfig.yaml
        if: failure()
        run: |
          echo "=== Driver pods ==="
          kubectl get pods -n gpu-operator -l app=nvidia-driver-daemonset
          POD=$(kubectl get pods -n gpu-operator -l app=nvidia-driver-daemonset \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [[ -n "${POD}" ]]; then
            echo "=== Logs for ${POD} ==="
            kubectl logs -n gpu-operator "${POD}" -c nvidia-driver-ctr --tail=100 || true
            echo "=== Events ==="
            kubectl describe pod -n gpu-operator "${POD}" || true
          fi
          echo "=== driver-cache registry pod ==="
          kubectl get pods -n nvidia-driver-cache || true

      - name: Cleanup
        env:
          KUBECONFIG: kubeconfig.yaml
        if: always()
        run: |
          helm uninstall gpu-operator -n gpu-operator || true
          helm uninstall driver-cache -n nvidia-driver-cache || true
          kubectl delete secret driver-cache-tls -n gpu-operator --ignore-not-found
          kubectl delete namespace nvidia-driver-cache --ignore-not-found
